<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Cross-eye 3D Shape Field - Quaternion Fixed</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #stereoWrap {
      display: flex;
      width: 100vw;
      height: 100vh;
      background: #05070a;
    }

    canvas {
      width: 50vw;
      height: 100vh;
      display: block;
      outline: none;
      touch-action: none;
    }

    #enable {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      border: 1px solid rgba(148, 163, 184, 0.55);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.72);
      color: #e2e8f0;
      padding: 8px 13px;
      font-size: 13px;
      cursor: pointer;
    }

    #tinyStatus {
      position: fixed;
      right: 8px;
      bottom: 6px;
      z-index: 5;
      color: rgba(203, 213, 225, 0.72);
      font-size: 10px;
      pointer-events: none;
      text-shadow: 0 1px 2px black;
      white-space: pre;
      text-align: right;
    }
  </style>
</head>
<body>
  <button id="enable">Enable motion / recenter</button>

  <div id="stereoWrap">
    <!-- Cross-eye order: right-eye view on the left, left-eye view on the right -->
    <canvas id="rightEyeCanvas"></canvas>
    <canvas id="leftEyeCanvas"></canvas>
  </div>

  <div id="tinyStatus">loading</div>

  <script>
    /*
      Quaternion-fixed phone orientation version.

      Why this exists:
      - Direct alpha/beta/gamma mapping breaks when beta approaches +/-180.
      - That causes yaw to appear to change during top-edge tilt.
      - Here we convert the device orientation into a quaternion first.
      - Then we calculate the camera forward vector from the quaternion.
      - Then we extract yaw and pitch from that vector.
      - Roll is never applied.

      Intended posture:
      - Phone sideways / landscape.
      - Phone held upright like a window.
      - Tap Recenter in your comfortable forward posture.
    */

    const WORLD_RADIUS = 7.5;
    const EYE_SEPARATION = 0.18;

    // If up/down feels backward, change this to -1.
    const PITCH_SIGN = 1;

    const rightCanvas = document.getElementById("rightEyeCanvas");
    const leftCanvas = document.getElementById("leftEyeCanvas");
    const enableBtn = document.getElementById("enable");
    const tinyStatus = document.getElementById("tinyStatus");

    const rightEngine = new BABYLON.Engine(rightCanvas, true);
    const leftEngine = new BABYLON.Engine(leftCanvas, true);

    const look = {
      enabled: false,
      yaw: 0,
      pitch: 0,

      zeroYaw: null,
      zeroPitch: null,

      alpha: null,
      beta: null,
      gamma: null,
      compass: null,
      screenAngle: 0,
      orientationCount: 0
    };

    function setTinyStatus(msg) {
      tinyStatus.textContent = msg;
    }

    function clamp(v, lo, hi) {
      return Math.max(lo, Math.min(hi, v));
    }

    function degToRad(d) {
      return (Number(d) || 0) * Math.PI / 180;
    }

    function radToDeg(r) {
      return r * 180 / Math.PI;
    }

    function normalizeRad(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    function screenAngleDeg() {
      if (screen.orientation && typeof screen.orientation.angle === "number") return screen.orientation.angle;
      if (typeof window.orientation === "number") return window.orientation;
      return 0;
    }

    function makeMat(scene, name, hex, emissivePower = 0.18, alpha = 1) {
      const mat = new BABYLON.StandardMaterial(name, scene);
      const c = BABYLON.Color3.FromHexString(hex);
      mat.diffuseColor = c;
      mat.emissiveColor = c.scale(emissivePower);
      mat.specularColor = BABYLON.Color3.Black();
      mat.alpha = alpha;
      return mat;
    }

    function addShape(scene, kind, name, x, y, z, hex) {
      let mesh;

      if (kind === "box") {
        mesh = BABYLON.MeshBuilder.CreateBox(name, { size: 1.3 }, scene);
      } else if (kind === "sphere") {
        mesh = BABYLON.MeshBuilder.CreateSphere(name, { diameter: 1.45, segments: 32 }, scene);
      } else if (kind === "cylinder") {
        mesh = BABYLON.MeshBuilder.CreateCylinder(name, { diameter: 1.25, height: 1.7, tessellation: 32 }, scene);
      } else if (kind === "cone") {
        mesh = BABYLON.MeshBuilder.CreateCylinder(name, { diameterTop: 0, diameterBottom: 1.45, height: 1.8, tessellation: 32 }, scene);
      } else if (kind === "torus") {
        mesh = BABYLON.MeshBuilder.CreateTorus(name, { diameter: 1.55, thickness: 0.22, tessellation: 48 }, scene);
      } else {
        mesh = BABYLON.MeshBuilder.CreateBox(name, { size: 1.3 }, scene);
      }

      mesh.position.set(x, y, z);
      mesh.material = makeMat(scene, name + "Mat", hex);
      return mesh;
    }

    function addBillboardText(scene, name, text, x, y, z, hex) {
      const plane = BABYLON.MeshBuilder.CreatePlane(name, { width: 2.7, height: 0.7 }, scene);
      plane.position.set(x, y, z);
      plane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;

      const texture = new BABYLON.DynamicTexture(name + "Tex", { width: 512, height: 128 }, scene, true);
      const ctx = texture.getContext();
      ctx.clearRect(0, 0, 512, 128);
      ctx.font = "bold 54px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineWidth = 8;
      ctx.strokeStyle = "black";
      ctx.strokeText(text, 256, 64);
      ctx.fillStyle = hex;
      ctx.fillText(text, 256, 64);
      texture.update();

      const mat = new BABYLON.StandardMaterial(name + "Mat", scene);
      mat.diffuseTexture = texture;
      mat.emissiveTexture = texture;
      mat.opacityTexture = texture;
      mat.disableLighting = true;
      mat.specularColor = BABYLON.Color3.Black();
      plane.material = mat;
      return plane;
    }

    function makeScene(engine, canvas, eyeOffsetX, name) {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.02, 0.03, 0.05, 1);

      const camera = new BABYLON.FreeCamera(
        name + "Camera",
        new BABYLON.Vector3(eyeOffsetX, 0, 0),
        scene
      );
      camera.minZ = 0.01;
      camera.maxZ = 1000;
      camera.fov = BABYLON.Tools.ToRadians(74);
      scene.activeCamera = camera;

      const hemi = new BABYLON.HemisphericLight(name + "Hemi", new BABYLON.Vector3(0, 1, 0), scene);
      hemi.intensity = 0.9;

      const centerLight = new BABYLON.PointLight(name + "CenterLight", new BABYLON.Vector3(0, 0, 0), scene);
      centerLight.intensity = 0.8;
      centerLight.range = 24;

      const ghost = BABYLON.MeshBuilder.CreateSphere(name + "OriginGhost", { diameter: 0.25, segments: 16 }, scene);
      ghost.material = makeMat(scene, name + "GhostMat", "#ffffff", 0.5, 0.38);

      addShape(scene, "box",      name + "FrontCube",    0,    0,     WORLD_RADIUS, "#008cff");
      addShape(scene, "sphere",   name + "BackSphere",   0,    0,    -WORLD_RADIUS, "#ffb000");
      addShape(scene, "cylinder", name + "LeftColumn",  -WORLD_RADIUS, 0, 0, "#22c55e");
      addShape(scene, "cone",     name + "RightCone",    WORLD_RADIUS, 0, 0, "#f43f5e");
      addShape(scene, "torus",    name + "TopRing",      0,    WORLD_RADIUS * 0.72, 0, "#a855f7");
      addShape(scene, "box",      name + "BottomCube",   0,   -WORLD_RADIUS * 0.72, 0, "#14b8a6");

      addBillboardText(scene, name + "LabelFront", "FRONT", 0, 1.45, WORLD_RADIUS, "#dbeafe");
      addBillboardText(scene, name + "LabelBack", "BACK", 0, 1.45, -WORLD_RADIUS, "#fde68a");
      addBillboardText(scene, name + "LabelLeft", "LEFT", -WORLD_RADIUS, 1.45, 0, "#bbf7d0");
      addBillboardText(scene, name + "LabelRight", "RIGHT", WORLD_RADIUS, 1.45, 0, "#fecdd3");
      addBillboardText(scene, name + "LabelAbove", "ABOVE", 0, WORLD_RADIUS * 0.72 + 1.45, 0, "#e9d5ff");
      addBillboardText(scene, name + "LabelBelow", "BELOW", 0, -WORLD_RADIUS * 0.72 - 1.45, 0, "#ccfbf1");

      const ringMat = makeMat(scene, name + "RingMat", "#64748b", 0.25, 0.35);

      const ringXZ = BABYLON.MeshBuilder.CreateTorus(name + "RingXZ", {
        diameter: WORLD_RADIUS * 2,
        thickness: 0.035,
        tessellation: 128
      }, scene);
      ringXZ.rotation.x = Math.PI / 2;
      ringXZ.material = ringMat;

      const ringXY = BABYLON.MeshBuilder.CreateTorus(name + "RingXY", {
        diameter: WORLD_RADIUS * 2,
        thickness: 0.035,
        tessellation: 128
      }, scene);
      ringXY.material = ringMat;

      const ringYZ = BABYLON.MeshBuilder.CreateTorus(name + "RingYZ", {
        diameter: WORLD_RADIUS * 2,
        thickness: 0.035,
        tessellation: 128
      }, scene);
      ringYZ.rotation.y = Math.PI / 2;
      ringYZ.material = ringMat;

      const proof = BABYLON.MeshBuilder.CreateSphere(name + "StereoProofDot", {
        diameter: 0.13,
        segments: 12
      }, scene);
      proof.position.set(eyeOffsetX * 2.6, -0.38, 1.3);
      proof.material = makeMat(
        scene,
        name + "StereoProofDotMat",
        eyeOffsetX > 0 ? "#ff5a5a" : "#5aa7ff",
        0.75,
        0.9
      );

      scene.onBeforeRenderObservable.add(() => {
        // Eye pivot follows yaw only. Pitch changes view direction only.
        const c = Math.cos(look.yaw);
        const s = Math.sin(look.yaw);

        const x = eyeOffsetX * c;
        const z = -eyeOffsetX * s;

        camera.position.set(x, 0, z);

        camera.rotation.x = look.pitch;
        camera.rotation.y = look.yaw;
        camera.rotation.z = 0;
      });

      return scene;
    }

    const rightScene = makeScene(rightEngine, rightCanvas, +EYE_SEPARATION / 2, "right");
    const leftScene = makeScene(leftEngine, leftCanvas, -EYE_SEPARATION / 2, "left");

    rightEngine.runRenderLoop(() => {
      rightScene.render();
      leftScene.render();
    });

    window.addEventListener("resize", () => {
      rightEngine.resize();
      leftEngine.resize();
    });

    function deviceQuaternionFromEuler(alphaDeg, betaDeg, gammaDeg, screenDeg) {
      /*
        Based on the standard DeviceOrientation Z-X'-Y'' sequence:
        alpha around Z, beta around X, gamma around Y.
        Then rotate by screen orientation.

        We use Babylon quaternions so beta wrap-around does not scramble our yaw.
      */
      const alpha = degToRad(alphaDeg || 0);
      const beta = degToRad(betaDeg || 0);
      const gamma = degToRad(gammaDeg || 0);
      const orient = degToRad(screenDeg || 0);

      const qAlpha = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Z, alpha);
      const qBeta = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.X, beta);
      const qGamma = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Y, gamma);
      const qScreen = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Z, -orient);

      // Device orientation order.
      return qScreen.multiply(qAlpha).multiply(qBeta).multiply(qGamma);
    }

    function yawPitchFromDeviceQuaternion(q) {
      /*
        We need a stable "look vector" for a landscape phone held like a window.

        For a phone in this posture, the screen's normal is the direction the screen faces.
        In local device terms, use +Z as the approximate outward screen normal.

        We transform that vector by the full quaternion, then pull yaw and pitch from it.
        Since yaw/pitch come from a vector, roll cannot leak into the camera.
      */
      const m = BABYLON.Matrix.FromQuaternion(q);
      const forward = BABYLON.Vector3.TransformNormal(new BABYLON.Vector3(0, 0, 1), m).normalize();

      // Horizontal heading.
      const yaw = Math.atan2(forward.x, forward.z);

      // Vertical look angle.
      const flat = Math.sqrt(forward.x * forward.x + forward.z * forward.z);
      const pitch = Math.atan2(forward.y, flat);

      return { yaw, pitch };
    }

    function applyOrientation(ev) {
      look.orientationCount += 1;
      look.alpha = Number.isFinite(ev.alpha) ? ev.alpha : null;
      look.beta = Number.isFinite(ev.beta) ? ev.beta : null;
      look.gamma = Number.isFinite(ev.gamma) ? ev.gamma : null;
      look.compass = Number.isFinite(ev.webkitCompassHeading) ? ev.webkitCompassHeading : null;
      look.screenAngle = screenAngleDeg();

      if (!look.enabled) {
        setTinyStatus(
          "events " + look.orientationCount +
          " | waiting for enable"
        );
        return;
      }

      if (look.alpha === null || look.beta === null || look.gamma === null) {
        setTinyStatus("orientation missing alpha/beta/gamma");
        return;
      }

      const q = deviceQuaternionFromEuler(look.alpha, look.beta, look.gamma, look.screenAngle);
      let yp = yawPitchFromDeviceQuaternion(q);

      // iPhone compass is usually better for yaw heading when available,
      // but we still use quaternion-derived pitch.
      if (look.compass !== null) {
        yp.yaw = -degToRad(look.compass) + degToRad(look.screenAngle);
      }

      yp.pitch = clamp(yp.pitch * PITCH_SIGN, -1.22, 1.22);

      if (look.zeroYaw === null) look.zeroYaw = yp.yaw;
      if (look.zeroPitch === null) look.zeroPitch = yp.pitch;

      look.yaw = normalizeRad(yp.yaw - look.zeroYaw);
      look.pitch = clamp(yp.pitch - look.zeroPitch, -1.22, 1.22);

      setTinyStatus(
        "quaternion fixed\n" +
        "events " + look.orientationCount +
        " | yaw " + radToDeg(look.yaw).toFixed(0) +
        " | pitch " + radToDeg(look.pitch).toFixed(0) +
        "\nalpha " + (look.alpha ?? "null") +
        " | beta " + (look.beta ?? "null") +
        " | gamma " + (look.gamma ?? "null")
      );
    }

    window.addEventListener("deviceorientation", applyOrientation, true);
    window.addEventListener("deviceorientationabsolute", applyOrientation, true);

    async function requestPermissions() {
      try {
        if (typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission === "function") {
          const r = await DeviceMotionEvent.requestPermission();
          if (r !== "granted") return false;
        }

        if (typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function") {
          const r = await DeviceOrientationEvent.requestPermission();
          if (r !== "granted") return false;
        }

        return true;
      } catch (e) {
        setTinyStatus("permission error");
        return false;
      }
    }

    enableBtn.addEventListener("click", async () => {
      look.zeroYaw = null;
      look.zeroPitch = null;

      const ok = await requestPermissions();
      look.enabled = ok;

      if (ok) {
        enableBtn.textContent = "Recenter";
        setTinyStatus("motion enabled - quaternion fixed");
        setTimeout(() => { enableBtn.style.opacity = "0.35"; }, 1000);
      } else {
        enableBtn.textContent = "Motion blocked";
        setTinyStatus("motion unavailable or blocked");
      }
    });

    setTinyStatus("graphics loaded - quaternion fixed - tap enable");
  </script>
</body>
</html>
