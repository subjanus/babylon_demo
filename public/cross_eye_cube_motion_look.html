<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>iPhone Motion Sensor Proof</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #05070a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap {
      padding: 16px;
      max-width: 760px;
      margin: 0 auto;
    }
    button {
      width: 100%;
      border: 1px solid #334155;
      border-radius: 14px;
      background: #0f172a;
      color: #e2e8f0;
      padding: 14px;
      font-size: 16px;
      margin: 8px 0;
    }
    pre {
      white-space: pre-wrap;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.35;
      min-height: 320px;
    }
    .muted {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>iPhone Motion Sensor Proof</h2>
    <p class="muted">
      This page does no Babylon rendering. It only checks whether the browser is actually sending
      deviceorientation and devicemotion events after a tap.
    </p>

    <button id="btn">Enable sensors</button>
    <button id="reset">Reset counters</button>

    <pre id="out">Starting...</pre>
  </div>

  <script>
    const out = document.getElementById("out");
    const btn = document.getElementById("btn");
    const reset = document.getElementById("reset");

    const state = {
      secure: window.isSecureContext,
      userAgent: navigator.userAgent,
      permissionMotion: "not requested",
      permissionOrientation: "not requested",
      orientationEvents: 0,
      motionEvents: 0,
      lastOrientationAt: null,
      lastMotionAt: null,
      alpha: null,
      beta: null,
      gamma: null,
      absolute: null,
      compass: null,
      accel: null,
      rotationRate: null,
      errors: []
    };

    function fmt(n) {
      return Number.isFinite(n) ? Number(n).toFixed(3) : String(n);
    }

    function render() {
      const now = Date.now();
      out.textContent =
`secure context: ${state.secure}
DeviceOrientationEvent exists: ${typeof DeviceOrientationEvent !== "undefined"}
DeviceOrientationEvent.requestPermission exists: ${typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function"}
DeviceMotionEvent exists: ${typeof DeviceMotionEvent !== "undefined"}
DeviceMotionEvent.requestPermission exists: ${typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function"}

permission orientation: ${state.permissionOrientation}
permission motion: ${state.permissionMotion}

orientation events: ${state.orientationEvents}
last orientation: ${state.lastOrientationAt ? (now - state.lastOrientationAt) + " ms ago" : "never"}
alpha: ${fmt(state.alpha)}
beta: ${fmt(state.beta)}
gamma: ${fmt(state.gamma)}
absolute: ${state.absolute}
webkitCompassHeading: ${fmt(state.compass)}

motion events: ${state.motionEvents}
last motion: ${state.lastMotionAt ? (now - state.lastMotionAt) + " ms ago" : "never"}
accelerationIncludingGravity: ${state.accel ? JSON.stringify(state.accel) : "null"}
rotationRate: ${state.rotationRate ? JSON.stringify(state.rotationRate) : "null"}

errors:
${state.errors.length ? state.errors.join("\n") : "none"}

userAgent:
${state.userAgent}`;
    }

    function onOrientation(ev) {
      state.orientationEvents += 1;
      state.lastOrientationAt = Date.now();
      state.alpha = ev.alpha;
      state.beta = ev.beta;
      state.gamma = ev.gamma;
      state.absolute = ev.absolute;
      state.compass = Number.isFinite(ev.webkitCompassHeading) ? ev.webkitCompassHeading : null;
      render();
    }

    function onMotion(ev) {
      state.motionEvents += 1;
      state.lastMotionAt = Date.now();

      const a = ev.accelerationIncludingGravity || ev.acceleration;
      state.accel = a ? {
        x: Number.isFinite(a.x) ? Number(a.x.toFixed(3)) : null,
        y: Number.isFinite(a.y) ? Number(a.y.toFixed(3)) : null,
        z: Number.isFinite(a.z) ? Number(a.z.toFixed(3)) : null
      } : null;

      const r = ev.rotationRate;
      state.rotationRate = r ? {
        alpha: Number.isFinite(r.alpha) ? Number(r.alpha.toFixed(3)) : null,
        beta: Number.isFinite(r.beta) ? Number(r.beta.toFixed(3)) : null,
        gamma: Number.isFinite(r.gamma) ? Number(r.gamma.toFixed(3)) : null
      } : null;

      render();
    }

    window.addEventListener("deviceorientation", onOrientation, true);
    window.addEventListener("deviceorientationabsolute", onOrientation, true);
    window.addEventListener("devicemotion", onMotion, true);

    btn.addEventListener("click", async () => {
      state.errors = [];

      try {
        if (typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission === "function") {
          state.permissionMotion = await DeviceMotionEvent.requestPermission();
        } else {
          state.permissionMotion = "no requestPermission API";
        }
      } catch (e) {
        state.permissionMotion = "error";
        state.errors.push("motion permission error: " + (e.message || e));
      }

      try {
        if (typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function") {
          state.permissionOrientation = await DeviceOrientationEvent.requestPermission();
        } else {
          state.permissionOrientation = "no requestPermission API";
        }
      } catch (e) {
        state.permissionOrientation = "error";
        state.errors.push("orientation permission error: " + (e.message || e));
      }

      render();
    });

    reset.addEventListener("click", () => {
      state.orientationEvents = 0;
      state.motionEvents = 0;
      state.lastOrientationAt = null;
      state.lastMotionAt = null;
      state.alpha = null;
      state.beta = null;
      state.gamma = null;
      state.absolute = null;
      state.compass = null;
      state.accel = null;
      state.rotationRate = null;
      state.errors = [];
      render();
    });

    setInterval(render, 1000);
    render();
  </script>
</body>
</html>
